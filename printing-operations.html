
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WP-UV-Pro | Printing Operations Knowledge Test</title>
  
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 24px;
    background-color: #f3f5f8;
    font-family: Arial, Helvetica, sans-serif;
    color: #243247;
  }

  main {
    max-width: 700px;
    margin: 30px auto;
    padding: 32px;
    background-color: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
  }

  h1 {
    color: #194c78;
    font-size: 18px;
    margin-bottom: 8px;
  }

  h2 {
    font-size: 28px;
    margin-top: 0;
    margin-bottom: 16px;
  }

  p {
    line-height: 1.6;
  }

  #quiz {
    margin-top: 28px;
  }

  .answer {
    display: block;
    width: 100%;
    padding: 16px;
    margin: 10px 0;
    border: 2px solid #dce2e8;
    border-radius: 10px;
    background-color: white;
    text-align: left;
    font-size: 16px;
    cursor: pointer;
  }

  .answer:hover {
    border-color: #2878b8;
    background-color: #f0f7ff;
  }

  .answer.correct {
    border-color: #238b55;
    background-color: #e9f7ef;
  }

  .answer.incorrect {
    border-color: #d9534f;
    background-color: #fff0ef;
  }

  #feedback {
    margin-top: 18px;
    font-weight: bold;
    line-height: 1.5;
  }

  #next-button {
    margin-top: 20px;
    padding: 14px 24px;
    background-color: #194c78;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
  }

  #next-button:hover {
    background-color: #103754;
  }

  @media (max-width: 600px) {
    body {
      padding: 10px;
    }

    main {
      margin: 10px auto;
      padding: 20px;
    }

    h2 {
      font-size: 23px;
    }
  }
</style>

</head>

<body>
  <main>
    <h1>WP-UV-Pro Training</h1>
  <h2>Printing Operations Knowledge Check</h2>
    <p>
  Test your knowledge of operating the WP-UV-Pro,
  using TWP Control Center, selecting printing modes,
  positioning the printhead, and monitoring print jobs
  before moving on to the next training section.
   </p>

    <div id="quiz">
      <p>Quiz questions will appear here.</p>
    </div>

    <div id="feedback" aria-live="polite"></div>

    <button id="next-button" type="button" hidden>
      Next Question
    </button>
  </main>
  
<script>

const questions = [
  {
    question: "What is the primary purpose of the TWP Control Center software?",
    answers: [
      "To edit artwork and create white spot channels.",
      "To operate the printer, control its movement, and manage print jobs.",
      "To automatically replace printer components.",
      "To convert vector artwork into raster images."
    ],
    correct: 1,
    explanation: "TWP Control Center is used to operate the WP-UV-Pro, control printer movement, configure printing operations, and manage print jobs."
  },
  {
    question: "Which printing mode should you select when printing without white ink?",
    answers: [
      "WKCMY",
      "KCMYW",
      "KCMY",
      "W only"
    ],
    correct: 2,
    explanation: "KCMY is the printing mode used when white ink is not required. Modes that include W are intended for printing configurations that use white ink."
  },
  {
    question: "What should you verify before starting a print?",
    answers: [
      "Ensure the printhead is correctly positioned at the start point, the tracks or wheels are parallel to the wall at the proper distance, the printing area is clear, and all selected settings are confirmed as correct.",
      "That the printhead is touching the wall.",
      "That the printer is moving before the print job is loaded.",
      "That the UV lamps are always set to maximum intensity."
    ],
    correct: 0,
    explanation: "Before printing, verify the printhead position, clearance from the wall, travel path, and appropriate printing settings."
  },
  {
    question: "What should you do if you notice an obstruction or unsafe condition while printing?",
    answers: [
      "Increase the printer speed to finish the print faster.",
      "Ignore the issue if the printer continues moving.",
      "Move the printer manually while it is printing.",
      "Stop the printing operation safely and resolve the issue before continuing."
    ],
    correct: 3,
    explanation: "An obstruction or unsafe condition can damage the printer or create a safety hazard. Stop the operation safely and correct the problem before resuming."
  },
  {
    question: "Why is it important to monitor the WP-UV-Pro while printing?",
    answers: [
      "To manually adjust the printer's mechanical alignment during every pass.",
      "To detect printing problems, ink delivery issues, or unexpected movement as early as possible.",
      "To change the artwork dimensions while the printer is moving.",
      "To eliminate the need for routine maintenance."
    ],
    correct: 1,
    explanation: "Monitoring the printer helps you identify problems early, including print quality issues, missing ink channels, obstacles, and unexpected printer movement."
  }
];



</script>

<script>
let currentQuestion = 0;
let answeredCorrectly = false;

const quizContainer = document.getElementById("quiz");
const feedback = document.getElementById("feedback");
const nextButton = document.getElementById("next-button");

// Display the current question and its answers.
function showQuestion() {
  answeredCorrectly = false;
  feedback.textContent = "";
  nextButton.hidden = true;

  const question = questions[currentQuestion];

  quizContainer.innerHTML = "";

  const progress = document.createElement("p");
  progress.textContent =
    `Question ${currentQuestion + 1} of ${questions.length}`;
  quizContainer.appendChild(progress);

  const heading = document.createElement("h3");
  heading.textContent = question.question;
  quizContainer.appendChild(heading);

  question.answers.forEach((answer, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "answer";
    button.textContent = answer;

    button.addEventListener("click", () => {
      checkAnswer(index, button);
    });

    quizContainer.appendChild(button);
  });
}

// Check the selected answer.
function checkAnswer(selectedIndex, selectedButton) {
  if (answeredCorrectly) return;

  const question = questions[currentQuestion];

  // Clear previous incorrect-answer highlighting.
  document.querySelectorAll(".answer").forEach(button => {
    button.classList.remove("incorrect");
  });

  if (selectedIndex === question.correct) {
    answeredCorrectly = true;
    selectedButton.classList.add("correct");

    feedback.textContent =
      "Correct! " + question.explanation;
    feedback.style.color = "#238b55";

    // Prevent additional answers after a correct selection.
    document.querySelectorAll(".answer").forEach(button => {
      button.disabled = true;
    });

    nextButton.hidden = false;

    if (currentQuestion === questions.length - 1) {
      nextButton.textContent = "Complete Quiz";
    } else {
      nextButton.textContent = "Next Question";
    }

  } else {
    selectedButton.classList.add("incorrect");

    feedback.textContent =
      "Not quite! Please try another answer.";
    feedback.style.color = "#d9534f";
  }
}

// Advance or display the completion message.
nextButton.addEventListener("click", () => {
  if (!answeredCorrectly) return;

  currentQuestion++;

  if (currentQuestion < questions.length) {
    showQuestion();
  } else {
    showCompletion();
  }
});

// Display the final completion message.
function showCompletion() {
  quizContainer.innerHTML = `
    <div style="text-align:center; padding:25px 0;">
      <h2 style="color:#238b55;">
        Printing Operations Complete!
      </h2>
      <p>
        Great job! You've successfully answered
all five Printing Operations questions.
      </p>
      <p>
        You're ready for the next section:
        <strong>Maintenance &amp; Shutdown</strong>
      </p>
      <button class="answer" id="restart-button"
              type="button">
        Restart Quiz
      </button>
    </div>
  `;

  feedback.textContent = "";
  nextButton.hidden = true;

  document.getElementById("restart-button")
    .addEventListener("click", () => {
      currentQuestion = 0;
      showQuestion();
    });
}

// Start the quiz.
showQuestion();
</script>

</body>
</html>
