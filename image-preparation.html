
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WP-UV-Pro | Image Preparation Knowlege Check</title>
  
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 24px;
    background-color: #f3f5f8;
    font-family: Arial, Helvetica, sans-serif;
    color: #243247;
  }

  main {
    max-width: 700px;
    margin: 30px auto;
    padding: 32px;
    background-color: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
  }

  h1 {
    color: #194c78;
    font-size: 18px;
    margin-bottom: 8px;
  }

  h2 {
    font-size: 28px;
    margin-top: 0;
    margin-bottom: 16px;
  }

  p {
    line-height: 1.6;
  }

  #quiz {
    margin-top: 28px;
  }

  .answer {
    display: block;
    width: 100%;
    padding: 16px;
    margin: 10px 0;
    border: 2px solid #dce2e8;
    border-radius: 10px;
    background-color: white;
    text-align: left;
    font-size: 16px;
    cursor: pointer;
  }

  .answer:hover {
    border-color: #2878b8;
    background-color: #f0f7ff;
  }

  .answer.correct {
    border-color: #238b55;
    background-color: #e9f7ef;
  }

  .answer.incorrect {
    border-color: #d9534f;
    background-color: #fff0ef;
  }

  #feedback {
    margin-top: 18px;
    font-weight: bold;
    line-height: 1.5;
  }

  #next-button {
    margin-top: 20px;
    padding: 14px 24px;
    background-color: #194c78;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
  }

  #next-button:hover {
    background-color: #103754;
  }

  @media (max-width: 600px) {
    body {
      padding: 10px;
    }

    main {
      margin: 10px auto;
      padding: 20px;
    }

    h2 {
      font-size: 23px;
    }
  }
</style>

</head>

<body>
  <main>
    <h1>WP-UV-Pro Training</h1>
    <h2>Image Preparation Knowledge Check</h2>

    <p>
      Test your knowledge of image preparation before
      moving on to the next training section.
    </p>

    <div id="quiz">
      <p>Quiz questions will appear here.</p>
    </div>

    <div id="feedback" aria-live="polite"></div>

    <button id="next-button" type="button" hidden>
      Next Question
    </button>
  </main>
  
<script>
const questions = [
  {
    question: "Why is image resolution important when preparing artwork for a wall print?",
    answers: [
      "It determines the printer's movement speed.",
      "It helps preserve image detail and sharpness at the intended print size.",
      "It automatically corrects image colors.",
      "It reduces the amount of ink required."
    ],
    correct: 1,
    explanation: "Image resolution affects how much detail is available when the artwork is printed at its final size."
  },
  {
    question: "What happens when you increase the PPI of a low-resolution image without adding genuine image detail?",
    answers: [
      "Photoshop restores the original missing details.",
      "The image automatically becomes suitable for any print size.",
      "The image may still appear blurry or pixelated.",
      "The image is automatically converted to vector artwork."
    ],
    correct: 2,
    explanation: "Increasing PPI alone cannot recover details that were not present in the original image."
  },
  {
    question: "When should you check an image's dimensions and resolution?",
    answers: [
      "After completing the wall print.",
      "Before generating the final printing file.",
      "Only if the printer displays an error.",
      "Only after importing the file into TWP Control Center."
    ],
    correct: 1,
    explanation: "Checking dimensions and resolution before generating the printing file helps prevent sizing and quality problems."
  },
  {
    question: "What is the primary advantage of vector artwork?",
    answers: [
      "It can be scaled without the same pixelation limitations as raster images.",
      "It eliminates the need for print preparation.",
      "It automatically adds a white ink channel.",
      "It reduces printer maintenance requirements."
    ],
    correct: 0,
    explanation: "Vector artwork uses mathematically defined shapes and can be scaled without the same pixelation issues as raster images."
  },
  {
    question: "What should you do before converting prepared artwork into a PRN file?",
    answers: [
      "Increase the image resolution regardless of its original quality.",
      "Remove all color information.",
      "Begin printing before checking the dimensions.",
      "Confirm the artwork's final size, quality, and required edits."
    ],
    correct: 3,
    explanation: "Always verify the artwork's final dimensions, image quality, and required edits before generating the PRN file."
  }
];
</script>

<script>
let currentQuestion = 0;
let answeredCorrectly = false;

const quizContainer = document.getElementById("quiz");
const feedback = document.getElementById("feedback");
const nextButton = document.getElementById("next-button");

// Display the current question and its answers.
function showQuestion() {
  answeredCorrectly = false;
  feedback.textContent = "";
  nextButton.hidden = true;

  const question = questions[currentQuestion];

  quizContainer.innerHTML = "";

  const progress = document.createElement("p");
  progress.textContent =
    `Question ${currentQuestion + 1} of ${questions.length}`;
  quizContainer.appendChild(progress);

  const heading = document.createElement("h3");
  heading.textContent = question.question;
  quizContainer.appendChild(heading);

  question.answers.forEach((answer, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "answer";
    button.textContent = answer;

    button.addEventListener("click", () => {
      checkAnswer(index, button);
    });

    quizContainer.appendChild(button);
  });
}

// Check the selected answer.
function checkAnswer(selectedIndex, selectedButton) {
  if (answeredCorrectly) return;

  const question = questions[currentQuestion];

  // Clear previous incorrect-answer highlighting.
  document.querySelectorAll(".answer").forEach(button => {
    button.classList.remove("incorrect");
  });

  if (selectedIndex === question.correct) {
    answeredCorrectly = true;
    selectedButton.classList.add("correct");

    feedback.textContent =
      "Correct! " + question.explanation;
    feedback.style.color = "#238b55";

    // Prevent additional answers after a correct selection.
    document.querySelectorAll(".answer").forEach(button => {
      button.disabled = true;
    });

    nextButton.hidden = false;

    if (currentQuestion === questions.length - 1) {
      nextButton.textContent = "Complete Quiz";
    } else {
      nextButton.textContent = "Next Question";
    }

  } else {
    selectedButton.classList.add("incorrect");

    feedback.textContent =
      "Not quite! Please try another answer.";
    feedback.style.color = "#d9534f";
  }
}

// Advance or display the completion message.
nextButton.addEventListener("click", () => {
  if (!answeredCorrectly) return;

  currentQuestion++;

  if (currentQuestion < questions.length) {
    showQuestion();
  } else {
    showCompletion();
  }
});

// Display the final completion message.
function showCompletion() {
  quizContainer.innerHTML = `
    <div style="text-align:center; padding:25px 0;">
      <h2 style="color:#238b55;">
        Image Preparation Complete!
      </h2>
      <p>
        Great job! You've successfully answered
        all five questions.
      </p>
      <p>
        You're ready for the next section:
        <strong>Assembly &amp; Safety</strong>.
      </p>
      <button class="answer" id="restart-button"
              type="button">
        Restart Quiz
      </button>
    </div>
  `;

  feedback.textContent = "";
  nextButton.hidden = true;

  document.getElementById("restart-button")
    .addEventListener("click", () => {
      currentQuestion = 0;
      showQuestion();
    });
}

// Start the quiz.
showQuestion();
</script>

</body>
</html>
